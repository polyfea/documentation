site_name: Polyfea Documentation
site_description: Project documentation site
site_author: Polyfea Team
site_url: https://polyfea.github.io/documentation

# Repository integration
repo_name: polyfea
repo_url: https://github.com/polyfea

# Custom CSS
extra_css:
  - stylesheets/extra.css

theme:
  name: material
  
  logo: assets/icon.png
  favicon: assets/icon.png
  
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer  # Add prev/next navigation
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts:
    - Introduction: core-concepts/introduction.md
    - Web Components: core-concepts/webcomponents.md
    - Kubernetes Custom Resources: core-concepts/customresources.md
    - Browser-Side Loading: core-concepts/browsercore.md
    - Display Rules: core-concepts/displayrules.md
    - The Complete Flow: core-concepts/flow.md
  - Tutorials:
    - Introduction: tutorials/introduction.md
    - Building a Web Component: tutorials/webcomponents.md
    - Building a MicroFrontend Image: tutorials/docker-image.md
    - Creating Kubernetes Manifests: tutorials/k8s-manifests.md
  - Projects:
    - projects/index.md
    - Controller: https://github.com/polyfea/polyfea-controller
    - Material Design Shell: https://github.com/polyfea/md-shell
    - Browser Core: https://github.com/polyfea/core
    - Helm Charts: https://github.com/polyfea/charts
    - Manifests: https://github.com/polyfea/manifests
    